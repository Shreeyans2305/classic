services:
  jekyll:
    image: jekyll/jekyll:4.2.2
    platform: linux/amd64
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    volumes:
      - .:/srv/jekyll
      - jekyll-bundle-cache:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"

volumes:
  jekyll-bundle-cache: